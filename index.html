:root {

  --shadow: oklch(24% 0.01 275 / 0.09); --shadow-soft: oklch(24% 0.01 275 / 0.05);

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: var(--t-sm); line-height: 1.5; }

/* ログイン画面が出ている間は後ろをスクロールさせない（スマホでボタンが押せなくなるのを防ぐ） */
body:has(#lock:not([hidden])) { overflow: hidden; }

/* 左のメニュー */
.side { min-width: 0; background: var(--nav-bg); color: var(--nav-ink); border-inline-end: 1px solid var(--nav-border);
  padding-block: 1rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 0.75rem; }
.brand { display: flex; align-items: center; gap: 0.5rem; font-size: 1.125rem; font-weight: 800; letter-spacing: -0.02em; padding-inline: 0.25rem; }

  padding: 0.5rem 0.75rem; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--nav-ink-muted);
  font-size: 0.9375rem; font-weight: 600; cursor: pointer; transition: background-color 180ms, color 180ms; }
.nav button:hover { background: var(--nav-bg-hover); color: var(--nav-ink); }
.nav button[aria-current="true"] { background: var(--nav-active-bg); color: var(--nav-active-ink); font-weight: 700; box-shadow: 0 1px 3px var(--shadow); }
.nav .n { min-width: 1.6rem; padding: 0 0.4rem; border-radius: var(--r-pill); background: var(--bad); color: var(--accent-ink); font-size: var(--t-2xs); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.nav .n[data-n="0"] { background: transparent; color: var(--nav-ink-muted); }
.nav button[aria-current="true"] .n { background: var(--nav-active-ink); color: var(--nav-active-bg); }
.soon { list-style: none; margin: 0; padding: 0 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; color: var(--nav-ink-muted); font-size: var(--t-xs); }
.soon li { display: flex; justify-content: space-between; gap: 0.5rem; }
.soon span { flex: 0 0 auto; font-size: var(--t-2xs); border: 1px solid var(--nav-border); border-radius: var(--r-pill); padding: 0 0.45rem; }
@media (max-width: 63.99rem) {

  .brand-sub, .nav-label, .soon { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 0.25rem; margin-top: 0.6rem; scrollbar-width: thin; }
  .nav button { width: auto; flex: 0 0 auto; font-size: var(--t-xs); white-space: nowrap; }
}

/* 本文 */
.main { min-width: 0; display: flex; flex-direction: column; }

  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1.5rem; }
.head h1 { margin: 0; font-size: var(--t-xl); font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.run { margin: 0.2rem 0 0; color: var(--ink-muted); font-size: var(--t-xs); }
.run[data-stale] { color: var(--warn-strong); font-weight: 700; }
.stats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.stat { display: flex; align-items: baseline; gap: 0.4rem; padding: 0.35rem 0.8rem; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: var(--t-xs); }
.stat b { font-size: var(--t-lg); font-variant-numeric: tabular-nums; }
.stat[data-k="open"] { background: var(--bad-soft); border-color: color-mix(in oklch, var(--bad) 45%, var(--border)); color: var(--bad-strong); }
.stat[data-k="doing"] { background: var(--warn-soft); border-color: color-mix(in oklch, var(--warn) 45%, var(--border)); color: var(--warn-strong); }
.stat[data-k="done"] { background: var(--good-soft); border-color: color-mix(in oklch, var(--good) 45%, var(--border)); color: var(--good-strong); }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  padding-block: 0 0.75rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); padding: 2px; }
.seg button { border: 0; background: transparent; padding: 0.25rem 0.8rem; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; color: var(--ink-muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.search { flex: 1 1 14rem; min-width: 0; max-width: 22rem; padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); }

.days { display: flex; gap: 0.25rem; overflow-x: auto; scrollbar-width: thin; border-block: 1px solid var(--border); background: var(--surface-muted);
  padding-block: 0.5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.days button { flex: 0 0 auto; white-space: nowrap; padding: 0.25rem 0.75rem; border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface); color: var(--ink-muted); font-size: var(--t-2xs); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.days button[data-pending]:not([data-pending="0"]) { color: var(--bad-strong); border-color: color-mix(in oklch, var(--bad) 45%, var(--border)); }
.days button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.body { padding-block: 0.75rem 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.note { margin: 0 0 0.75rem; color: var(--ink-muted); font-size: var(--t-xs); }
.note[data-tone="warn"] { color: var(--warn-strong); font-weight: 700; }
.tblwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); box-shadow: 0 1px 2px var(--shadow-soft), 0 10px 30px var(--shadow-soft); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
.tbl th { text-align: start; font-size: var(--t-2xs); font-weight: 700; letter-spacing: 0.04em; color: var(--ink-muted); padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface-muted); white-space: nowrap; }
.tbl td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr[data-h="open"] > td { background: var(--bad-soft); }
.tbl tr[data-h="open"] > td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
.tbl tr[data-h="doing"] > td { background: var(--warn-soft); }
.tbl tr[data-h="doing"] > td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
.tbl tr[data-h="done"] > td { background: var(--good-soft); }
.tbl tr[data-h="done"] > td:first-child { box-shadow: inset 4px 0 0 var(--good); }
.tbl tr[data-h="gone"] > td { background: var(--neutral-soft); color: var(--ink-muted); }
.tbl tr[data-h="gone"] > td:first-child { box-shadow: inset 4px 0 0 var(--border-strong); }

.sev { display: inline-block; min-width: 1.9rem; text-align: center; padding: 0 0.45rem; border-radius: var(--r-pill); font-weight: 800; font-size: var(--t-2xs); border: 1px solid; background: var(--surface); }
.sev[data-s="高"] { color: var(--bad-strong); border-color: var(--bad); }
.sev[data-s="中"] { color: var(--warn-strong); border-color: var(--warn); }
.sev[data-s="低"] { color: var(--ink-muted); border-color: var(--border-strong); }
.type { font-weight: 700; white-space: nowrap; }
.tag { display: inline-block; margin-left: 0.35rem; padding: 0 0.5rem; border-radius: var(--r-pill); font-size: var(--t-2xs); font-weight: 800; white-space: nowrap; border: 1px solid var(--border-strong); color: var(--ink-muted); background: var(--surface); }
.tag[data-t="大口予約"] { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
.loc { color: var(--ink); font-weight: 700; margin-right: 0.4rem; white-space: nowrap; }
.what { min-width: 18rem; max-width: 40rem; }
.tbl .c-who, .tbl .c-prod, .tbl .c-qty { display: none; }
.tbl.mode-manual .c-who, .tbl.mode-manual .c-prod, .tbl.mode-manual .c-qty { display: table-cell; }
.tbl.mode-manual .c-type, .tbl.mode-manual .c-what { display: none; }
.c-who { white-space: nowrap; font-weight: 700; }
.c-prod { min-width: 14rem; overflow-wrap: anywhere; font-weight: 700; }
.c-qty { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
.what strong { display: block; font-size: var(--t-sm); overflow-wrap: anywhere; }
.what p { margin: 0.2rem 0 0; color: var(--ink-muted); overflow-wrap: anywhere; }
.refs { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; margin-top: 0.3rem; font-weight: 600; }
.pill { display: inline-block; margin-top: 0.3rem; padding: 0 0.5rem; border-radius: var(--r-pill); font-size: var(--t-2xs); font-weight: 700; border: 1px solid var(--border-strong); color: var(--ink-muted); background: var(--surface); }
.when { white-space: nowrap; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.when b { color: var(--ink); font-weight: 600; }
.act { min-width: 15rem; display: grid; gap: 0.35rem; }
.act .row { display: flex; gap: 0.35rem; }
.act select, .act input { min-width: 0; width: 100%; padding: 0.3rem 0.5rem; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); font-size: var(--t-xs); }
.act select:disabled, .act input:disabled { opacity: 0.6; }
.by { color: var(--ink-faint); font-size: var(--t-2xs); }
.by[data-err] { color: var(--bad-strong); font-weight: 700; }
.empty { padding: 2.5rem 1rem; text-align: center; color: var(--ink-muted); }
.empty strong { display: block; color: var(--ink); font-size: var(--t-md); margin-bottom: 0.25rem; }

/* 携帯: 表は行ごとのカード */
@media (max-width: 40rem) {
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { border-bottom: 1px solid var(--border); }
  .tbl td { border-bottom: 0; padding: 0.35rem 0.85rem; }
  .tbl tr > td:first-child { padding-top: 0.75rem; }
  .tbl tr > td:last-child { padding-bottom: 0.85rem; }
  /* 1行目に 重要度・種類・予約日 を並べる。色は行（カード）全体に付ける */
  .tbl tr > td:nth-child(-n+2) { display: inline-block; width: auto; vertical-align: middle; padding-top: 0.75rem; padding-bottom: 0; }
  .tbl tr > td:nth-child(2) { padding-left: 0; }
  .tbl tr > td.when { padding-top: 0.3rem; padding-bottom: 0; font-size: var(--t-2xs); }
  .tbl tr > td.when::before { content: "予約日 "; font-weight: 700; }
  .tbl tr > td.when[data-empty] { display: none; }
  .tbl tr[data-h] > td { background: transparent; box-shadow: none; }
  .tbl tr[data-h="open"] { background: var(--bad-soft); box-shadow: inset 4px 0 0 var(--bad); }
  .tbl tr[data-h="doing"] { background: var(--warn-soft); box-shadow: inset 4px 0 0 var(--warn); }
  .tbl tr[data-h="done"] { background: var(--good-soft); box-shadow: inset 4px 0 0 var(--good); }
  .tbl tr[data-h="gone"] { background: var(--neutral-soft); box-shadow: inset 4px 0 0 var(--border-strong); }
  .what, .act { min-width: 0; max-width: none; }
  .tbl.mode-manual .c-who, .tbl.mode-manual .c-prod, .tbl.mode-manual .c-qty { display: block; }
  .tbl.mode-manual .c-who::before { content: "担当 "; font-weight: 400; color: var(--ink-muted); }
  .tbl.mode-manual .c-qty::before { content: "数量 "; font-weight: 400; color: var(--ink-muted); }
  .tbl.mode-manual td.when::before { content: "変更日 "; }
  .c-prod { min-width: 0; }
  .what strong { font-size: var(--t-sm); }
  .head { padding-block: 0.9rem 0.5rem; }
  .head h1 { font-size: 1.25rem; }
  .stat { padding: 0.2rem 0.6rem; }
  .stat b { font-size: var(--t-md); }
  .who { margin-left: 0; }
}
/* パスワード画面（claude.ai のアカウントが無い人向け・Stockan のログインと同じ「共有パスワード」） */
.lock { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--nav-bg);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock-card { width: min(100%, 22rem); display: grid; gap: 0.75rem; padding: 1.5rem; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); box-shadow: 0 10px 30px var(--shadow); }
.lock-card .brand { color: var(--ink); padding: 0; }
.lock-card p { margin: 0; color: var(--ink-muted); font-size: var(--t-xs); }
.lock-card label { font-weight: 700; font-size: var(--t-xs); }

.lock-card button:disabled { opacity: 0.6; cursor: progress; }
.lock-err { color: var(--bad-strong); font-weight: 700; font-size: var(--t-xs); }
.who { margin-left: auto; display: inline-flex; align-items: center; gap: 0.4rem; color: var(--ink-muted); font-size: var(--t-xs); white-space: nowrap; }
.who b { color: var(--ink); }
.who button { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-pill); padding: 0.15rem 0.6rem; font-size: var(--t-2xs); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>在庫ズレ見張り</div>
    <p>sig-platform・HP の巡回アラート。名前は「誰が処理したか」として記録に残ります。（v6）</p>

    <input id="whoName" type="text" autocomplete="name" placeholder="例：大林" required>
    <label for="pw">共有パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="pwBtn">開く</button>
    <span class="lock-err" id="lockErr" hidden>パスワードが違います。もう一度入力してください。</span>
  </form>
</div>

<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>在庫ズレ見張り</div>
    <div class="brand-sub">sig-platform・HP の巡回アラート</div>
    <div class="nav-label">アラートの種類</div>
    <nav class="nav" id="nav" aria-label="アラートの種類"></nav>
  </aside>

  <main class="main">
    <header class="head">
      <div>
        <h1 id="viewTitle">すべてのアラート</h1>
        <p class="run" id="run">巡回の結果を読み込んでいます…</p>
      </div>
      <div class="stats" id="stats">
        <span class="stat" data-k="open">未対応 <b id="sOpen">–</b></span>
        <span class="stat" data-k="doing">対応中 <b id="sDoing">–</b></span>
        <span class="stat" data-k="done">対応済み <b id="sDone">–</b></span>
      </div>
    </header>
    <div class="bar">
      <div class="seg" role="group" aria-label="表示する対応状況">
        <button type="button" id="fOpen" aria-pressed="true">未対応・対応中</button>
        <button type="button" id="fAll" aria-pressed="false">すべて</button>
      </div>
      <input class="search" id="q" type="search" placeholder="商品名・販売先・番号で絞り込み" aria-label="絞り込み">
      <span class="who">担当 <b id="whoLabel">–</b> <button type="button" id="logout">担当者を変える</button></span>
    </div>
    <div class="days" id="days" role="tablist" aria-label="予約日の月"></div>
    <div class="body">
      <p class="note" id="note" hidden></p>
      <div class="tblwrap">
        <table class="tbl">
          <thead><tr><th>重要度</th><th class="c-type">種類</th><th class="c-date" id="thDate">予約日</th><th class="c-who">担当者</th><th class="c-prod">商品名</th><th class="c-qty">変更前→変更後</th><th class="c-what">内容</th><th>対応</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty"><strong>まだアラートがありません</strong>巡回の結果が書き込まれると、ここに一覧で出ます。</div>
      </div>
    </div>
  </main>
</div>

<script>
window.addEventListener("error", (e) => { const el = document.getElementById("lockErr"); if (el) { el.hidden = false; el.textContent = "ページのエラー：" + (e.message || e.error) + "（" + (e.lineno || "") + "行）"; } });
window.addEventListener("unhandledrejection", (e) => { const el = document.getElementById("lockErr"); if (el) { el.hidden = false; el.textContent = "ページのエラー：" + (e.reason && e.reason.message || e.reason); } });
</script>
<script>
const TYPES = [
  ["all", "すべて"], ["neg", "マイナス在庫"], ["dupout", "二重登録の疑い"],
  ["transfer", "移動の未受取"], ["shiire", "仕入れと在庫の違い"], ["unpaid-t", "未振込（トレカ）"], ["unpaid-o", "未振込（その他）"], ["hpres", "予約確定のまま（HP）"], ["dupin", "買取の連携重複"], ["kizu", "傷品への移行漏れ"], ["manual", "手動の在庫訂正"],
];
const TYPE_BY_SLUG = Object.fromEntries(TYPES);
const STATUSES = ["未対応", "対応中", "対応済み", "問題なし"];
const CAUSES = ["", "種類の選び間違い", "変換・傷移行の入力漏れ", "二重登録", "入力漏れ・入力遅れ", "拠点違い", "移動の受取忘れ", "システム側の不具合", "正しい（ズレではない）", "その他"];
const SEV = { 高: 0, 中: 1, 低: 2 };
const ST = { 未対応: 0, 対応中: 1, 対応済み: 2, 問題なし: 2 };

const state = { alerts: new Map(), meta: null, type: "all", onlyOpen: true, day: "all", q: "", canWrite: true, loaded: false };
let db = null, user = null, uid = null;
const rowCache = new Map();
const writeChain = new Map();
const $ = (id) => document.getElementById(id);

const jst = (iso, withDate = true) => {
  if (!iso) return "";
  const d = new Date(new Date(iso).getTime() + 9 * 3600000);
  const p = (n) => String(n).padStart(2, "0");
  return (withDate ? `${p(d.getUTCMonth() + 1)}/${p(d.getUTCDate())} ` : "") + `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
};
const dayOf = (iso) => new Date(new Date(iso).getTime() + 9 * 3600000).toISOString().slice(0, 10);
const monthOf = (a) => (/^\d{4}[-/]\d{2}/.test(a.date || "") ? String(a.date).slice(0, 7).replace("/", "-") : "none");
const handled = (a) => a.active === false ? "gone" : a.status === "対応中" ? "doing" : (a.status === "対応済み" || a.status === "問題なし") ? "done" : "open";
const isOpen = (a) => { const h = handled(a); return h === "open" || h === "doing"; };

function typeSlug(t) { const e = TYPES.find(([, name]) => name === t); return e ? e[0] : "other"; }

function readHash() {
  const h = location.hash.replace(/^#/, "");
  state.type = TYPE_BY_SLUG[h] ? h : "all";
}

function renderNav() {
  const counts = {};
  for (const a of state.alerts.values()) if (handled(a) === "open") { counts.all = (counts.all || 0) + 1; const s = typeSlug(a.type); counts[s] = (counts[s] || 0) + 1; }
  const nav = $("nav");
  nav.replaceChildren(...TYPES.map(([slug, name]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-current", String(state.type === slug));
    const label = document.createElement("span"); label.textContent = name;
    const n = document.createElement("span"); n.className = "n"; n.dataset.n = String(counts[slug] || 0); n.textContent = counts[slug] || 0;
    b.append(label, n);
    b.addEventListener("click", () => { location.hash = slug === "all" ? "all" : slug; });
    return b;
  }));
  $("viewTitle").textContent = state.type === "all" ? "すべてのアラート" : TYPE_BY_SLUG[state.type];
}

function renderStats() {
  let o = 0, d = 0, f = 0;
  for (const a of state.alerts.values()) { const h = handled(a); if (h === "open") o++; else if (h === "doing") d++; else if (h === "done") f++; }
  $("sOpen").textContent = o; $("sDoing").textContent = d; $("sDone").textContent = f;
}

function renderRun() {
  const el = $("run");
  if (!state.meta) { el.textContent = state.loaded ? "巡回の結果はまだ書き込まれていません" : "巡回の結果を読み込んでいます…"; return; }
  const ageH = (Date.now() - new Date(state.meta.at)) / 3600000;
  el.textContent = `最終巡回 ${jst(state.meta.at)}（${state.meta.scope || "sig-platform"}）`;
  if (ageH > 26) { el.dataset.stale = ""; el.textContent += ` ・ ${Math.floor(ageH / 24)}日以上更新されていません`; } else delete el.dataset.stale;
}

function inView(a, ignoreDay) {
  if (state.type !== "all" && typeSlug(a.type) !== state.type) return false;
  if (state.onlyOpen && !isOpen(a)) return false;
  if (!ignoreDay && state.day !== "all" && monthOf(a) !== state.day) return false;
  if (state.q) {
    const hay = `${a.title} ${a.detail} ${a.loc} ${a.memo || ""}`.toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

// 上のタブは「予約日の月」ごと（1月・2月・3月…）。予約日が無いもの（マイナス在庫など）は「日付なし」
function renderDays() {
  const days = new Map();
  for (const a of state.alerts.values()) {
    if (!inView(a, true)) continue;
    const d = monthOf(a);
    const e = days.get(d) || { n: 0, open: 0 };
    e.n++; if (handled(a) === "open") e.open++;
    days.set(d, e);
  }
  const thisYear = String(new Date().getFullYear());
  // 件数が無い月も選べるように、今年の1月〜12月は常に出す
  for (let m = 1; m <= 12; m++) { const k = `${thisYear}-${String(m).padStart(2, "0")}`; if (!days.has(k)) days.set(k, { n: 0, open: 0 }); }
  if (state.day !== "all" && !days.has(state.day)) state.day = "all";
  const keys = [...days.keys()].sort((x, y) => (x === "none") - (y === "none") || y.localeCompare(x)); // 新しい月から（11月→10月→…→1月）、日付なしは最後
  const monthLabel = (k) => k === "none" ? "日付なし" : `${k.slice(0, 4) === thisYear ? "" : `${k.slice(0, 4)}年`}${Number(k.slice(5, 7))}月`;
  const mk = (key, label, pending) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(state.day === key));
    b.dataset.pending = String(pending);
    b.textContent = label;
    b.addEventListener("click", () => { state.day = key; render(); });
    return b;
  };
  const total = [...days.values()].reduce((s, e) => s + e.open, 0);
  $("days").replaceChildren(mk("all", `すべての月 ・ 未対応 ${total}`, total),
    ...keys.map((k) => { const e = days.get(k); return mk(k, `${monthLabel(k)} ・ ${e.open ? `未対応 ${e.open}` : `${e.n}件`}`, e.open); }));
}

function option(sel, value, label) { const o = document.createElement("option"); o.value = value; o.textContent = label; sel.append(o); }

function buildRow(key) {
  const tr = document.createElement("tr");
  const c = Array.from({ length: 8 }, () => document.createElement("td")); // 重要度・種類・日付・担当者・商品名・変更前→変更後・内容・対応
  tr.append(...c);
  const sev = document.createElement("span"); sev.className = "sev"; c[0].append(sev);
  const type = document.createElement("span"); type.className = "type";
  const tag = document.createElement("span"); tag.className = "tag"; // 大口予約／一般予約
  c[1].append(type, tag);
  c[1].classList.add("c-type"); c[2].className = "when c-date"; c[3].className = "c-who"; c[4].className = "c-prod"; c[5].className = "c-qty";
  c[6].className = "what c-what";
  const title = document.createElement("strong"), detail = document.createElement("p"), refs = document.createElement("div"), gone = document.createElement("span");
  const loc = document.createElement("b"), dtext = document.createElement("span");
  loc.className = "loc"; detail.append(loc, dtext);
  refs.className = "refs"; gone.className = "pill"; gone.textContent = "最新の巡回で消えました（自動で解消）";
  c[6].append(title, detail, refs, gone);
  c[7].className = "act";
  const row = document.createElement("div"); row.className = "row";
  const status = document.createElement("select"); status.id = `st-${key}`; status.setAttribute("aria-label", "対応状況");
  STATUSES.forEach((s) => option(status, s, s));
  const cause = document.createElement("select"); cause.id = `ca-${key}`; cause.setAttribute("aria-label", "原因");
  CAUSES.forEach((s) => option(cause, s, s || "原因を選ぶ"));
  row.append(status, cause);
  const memo = document.createElement("input"); memo.id = `me-${key}`; memo.type = "text"; memo.placeholder = "メモ（何をしたか・誰に確認したか）"; memo.setAttribute("aria-label", "メモ");
  const by = document.createElement("span"); by.className = "by";
  c[7].append(row, memo, by);

  status.addEventListener("change", () => save(key, { status: status.value }, by));
  cause.addEventListener("change", () => save(key, { cause: cause.value }, by));
  memo.addEventListener("change", () => save(key, { memo: memo.value.trim() }, by));
  const r = { tr, sev, type, tag, loc, dtext, title, refs, gone, when: c[2], who: c[3], prod: c[4], qty: c[5], status, cause, memo, by };
  rowCache.set(key, r);
  return r;
}

function fillRow(r, a) {
  r.tr.dataset.h = handled(a);
  r.sev.dataset.s = a.severity; r.sev.textContent = a.severity;
  r.type.textContent = a.type; r.loc.textContent = a.loc || "";
  r.who.textContent = a.who || ""; r.prod.textContent = a.product || ""; r.qty.textContent = a.qty || "";
  r.tag.textContent = a.tag || ""; r.tag.hidden = !a.tag; r.tag.dataset.t = a.tag || "";
  r.title.textContent = a.title; r.dtext.textContent = a.detail || "";
  r.refs.replaceChildren(...(a.refs || []).map((x) => { const l = document.createElement("a"); l.href = x.url; l.target = "_blank"; l.rel = "noopener"; l.textContent = `${x.label} を開く`; return l; }));
  r.gone.hidden = a.active !== false;
  r.when.textContent = a.date ? String(a.date).replace(/-/g, "/").slice(0, 16) : "—";
  if (a.date) delete r.when.dataset.empty; else r.when.dataset.empty = "";
  r.status.value = a.status || "未対応";
  r.cause.value = CAUSES.includes(a.cause || "") ? (a.cause || "") : "その他";
  if (document.activeElement !== r.memo) r.memo.value = a.memo || "";
  [r.status, r.cause, r.memo].forEach((x) => { x.disabled = !state.canWrite; });
  r.by.textContent = a.at ? `${a.byName ? `${a.byName} ・ ` : ""}更新 ${jst(a.at)}` : "";
  r.by.dataset.uid = a.byName ? "" : (a.by || ""); // 名前を入れて記録したものはその名前を出す
  delete r.by.dataset.err;
}

function fillNames() {}

function renderRows() {
  const list = [...state.alerts.values()].filter((a) => inView(a))
    .sort((a, b) => (handled(a) === "gone") - (handled(b) === "gone") || ST[a.status || "未対応"] - ST[b.status || "未対応"] || SEV[a.severity] - SEV[b.severity] || String(b.firstSeen).localeCompare(String(a.firstSeen)));
  // 手動の在庫訂正だけは 重要度・変更日・担当者・商品名・変更前→変更後・対応 の列で見せる
  const manual = state.type === "manual" || state.type === "kizu"; // 担当者・商品名・数量の列で見せる
  document.querySelector(".tbl").classList.toggle("mode-manual", manual);
  $("thDate").textContent = manual ? "変更日" : "予約日";
  const tbody = $("rows");
  const rows = list.map((a) => { const r = rowCache.get(a.key) || buildRow(a.key); fillRow(r, a); return r; });
  const wanted = rows.map((r) => r.tr);
  const same = wanted.length === tbody.children.length && wanted.every((tr, i) => tbody.children[i] === tr);
  if (!same) tbody.replaceChildren(...wanted);
  const empty = $("empty");
  empty.hidden = list.length > 0;
  if (!list.length && state.alerts.size) empty.innerHTML = "<strong>この条件のアラートはありません</strong>「すべて」に切り替えると対応済みも表示します。";
  fillNames(rows);
}

function render() {
  renderNav(); renderStats(); renderRun(); renderDays(); renderRows();
  $("fOpen").setAttribute("aria-pressed", String(state.onlyOpen));
  $("fAll").setAttribute("aria-pressed", String(!state.onlyOpen));
}

function save(key, patch, byEl) {
  const prev = writeChain.get(key) || Promise.resolve();
  const next = prev.then(() => call("saveAlert", token, key, patch)).then((a) => { state.alerts.set(key, a); render(); }).catch((e) => {
    byEl.dataset.err = "";
    byEl.textContent = /ログイン/.test(e.message) ? "ログインが切れました。「担当者を変える」から入り直してください" : "保存できませんでした。もう一度選んでください";
  });
  writeChain.set(key, next);
}

function note(text, tone) { const n = $("note"); n.hidden = !text; n.textContent = text || ""; if (tone) n.dataset.tone = tone; else delete n.dataset.tone; }

$("fOpen").addEventListener("click", () => { state.onlyOpen = true; render(); });
$("fAll").addEventListener("click", () => { state.onlyOpen = false; render(); });
let qTimer;
$("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 150); });
addEventListener("hashchange", () => { readHash(); state.day = "all"; render(); });
readHash();
render();

// Google Apps Script 版: ログイン・一覧・保存はサーバー（Code.gs）に頼む。名前は記録の「誰が処理したか」に使う
let who = "", token = "";
// google.script.run は Google にログイン中のブラウザ（複数アカウント等）で失敗するので、このウェブアプリに直接 POST する
const EXEC = "https://script.google.com/macros/s/AKfycbxTpJIur4Ge5lHx0o3JvFwx6gJtbjuX3P84kf-kihe4p0zw6HsrONUqYpcMc4oOLHDf/exec";
async function call(fn, ...args) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000); // 20秒で必ず理由を出す
  let r;
  try { r = await fetch(EXEC, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: fn, args }), signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "20秒たっても応答がありません" : "通信できません：" + e.message); }
  finally { clearTimeout(timer); }
  if (!r.ok) throw new Error("サーバーの応答 " + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "エラー");
  return j.result;
}
async function load() {
  const r = await call("listAlerts", token);
  state.alerts = new Map(r.alerts.map((a) => [a.key, a]));
  state.meta = r.meta; state.loaded = true;
  render();
}
function enter(t, name) {
  token = t; who = name;
  try { sessionStorage.setItem("zaiko-token", t); localStorage.setItem("zaiko-who", name); } catch {}
  $("whoLabel").textContent = who;
  $("lock").hidden = true;
}
try { $("whoName").value = localStorage.getItem("zaiko-who") || ""; } catch {}
($("whoName").value ? $("pw") : $("whoName")).focus();
$("logout").addEventListener("click", () => {
  token = ""; try { sessionStorage.removeItem("zaiko-token"); } catch {}
  $("pw").value = ""; $("lockErr").hidden = true; $("lock").hidden = false; $("whoName").focus();
});
async function doLogin() {
  const name = $("whoName").value.trim();
  if (!name) { $("whoName").focus(); return; }
  $("pwBtn").disabled = true; $("pwBtn").textContent = "確認しています…"; $("lockErr").hidden = true;
  try {
    const r = await call("login", name, $("pw").value);
    enter(r.token, r.name);
    await load();
  } catch (err) {
    $("lockErr").textContent = /パスワード|名前/.test(err.message) ? err.message : "入れませんでした（" + err.message + "）。もう一度押してください。";
    $("lockErr").hidden = false;
  } finally {
    $("pwBtn").disabled = false; $("pwBtn").textContent = "開く";
  }
}
$("pwBtn").type = "button";
$("pwBtn").addEventListener("click", doLogin);
$("lockForm").addEventListener("submit", (e) => { e.preventDefault(); doLogin(); });
["whoName", "pw"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doLogin(); } }));
// 同じタブで開き直したときは入り直さなくてよい（6時間まで）
(async () => {
  let t = "";
  try { t = sessionStorage.getItem("zaiko-token") || ""; } catch {}
  if (!t) return;
  try { enter(t, localStorage.getItem("zaiko-who") || ""); await load(); } catch { $("lock").hidden = false; }
})();
// 1分ごとに読み直して、ほかの人の記録や巡回結果を反映する
setInterval(() => { if (token && document.visibilityState === "visible") load().catch(() => {}); }, 60000);
</script>
</body></html>
